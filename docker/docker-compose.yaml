# Application services only (CommCare API + workers).
#
# Infrastructure (PostgreSQL, Redis, Kafka, observability) lives in
# docker-compose.infra.yaml and should stay running across app deploys.
#
# One-time / rare infra start (or after infra config changes):
#   docker compose -f docker/docker-compose.infra.yaml up -d
#
# Deploy / restart application containers only:
#   docker compose -f docker/docker-compose.yaml up -d --build
#   or: ./scripts/run.sh
#
# Requires the shared Docker network `commcare` (created by infra compose).
# Start infra before the app, or app containers will fail to connect.

name: commcare-app

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: commcare-app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${HTTP_PORT:-3000}:3000'
    env_file:
      - ../.env
    environment:
      HTTP_PORT: 3000
      WRITER_DB_HOST: db
      READER_DB_HOST: db
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:9092
      KAFKA_SUBSCRIBER: ALL
      BULLMQ_SUBSCRIBER: ALL
      BULLMQ_CONSUMERS_ENABLED: 'true'
      ARI_HOST: http://asterisk:8088
      ARI_USER: commcare
      ARI_PASSWORD: commcare-dev-secret
      ARI_WS_URL: ws://asterisk:8088/ari/events?app=pbx&api_key=commcare:commcare-dev-secret
      ARI_CONSUMER_ENABLED: 'false'
      TRACING_ENABLED: 'true'
      OTEL_SERVICE_NAME: commcare
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    networks:
      - commcare
    restart: unless-stopped

  ari-consumer:
    build:
      context: ..
      dockerfile: docker/ari-consumer/Dockerfile
    container_name: commcare-ari-consumer
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file:
      - ../.env
    environment:
      ARI_CONSUMER_ENABLED: 'true'
      ARI_HOST: http://asterisk:8088
      ARI_USER: commcare
      ARI_PASSWORD: commcare-dev-secret
      ARI_WS_URL: ws://asterisk:8088/ari/events?app=pbx&api_key=commcare:commcare-dev-secret
      KAFKA_SUBSCRIBER: 'NONE'
      BULLMQ_SUBSCRIBER: 'NONE'
      BULLMQ_CONSUMERS_ENABLED: 'false'
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:9092
      TRACING_ENABLED: 'true'
      OTEL_SERVICE_NAME: commcare-ari-consumer
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    networks:
      - commcare
    restart: unless-stopped

  asterisk-cdr-worker:
    build:
      context: ..
      dockerfile: docker/asterisk-cdr-worker/Dockerfile
    container_name: commcare-asterisk-cdr-worker
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file:
      - ../.env
    environment:
      WEBHOOK_URL: http://app:3000/calls/cdr/webhook
      AMI_HOST: asterisk
      AMI_PORT: 5038
      AMI_USERNAME: commcare
      AMI_SECRET: commcare-ami-secret
    depends_on:
      app:
        condition: service_healthy
    networks:
      - commcare
    restart: unless-stopped

networks:
  commcare:
    external: true
    name: commcare
