; CommCare dev PBX — static endpoints 101/102 for local softphone testing.
; Production extensions are provisioned via FreePBX sync (ExtensionService).

[global]
type = global
max_forwards = 70
user_agent = CommCare-Asterisk

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060

[endpoint-template](!)
type = endpoint
context = from-internal
disallow = all
allow = ulaw,alaw,gsm
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
media_use_received_transport = yes

[auth-template](!)
type = auth
auth_type = userpass

[aor-template](!)
type = aor
max_contacts = 3
remove_existing = yes

[101](endpoint-template)
auth = 101-auth
aors = 101-aor
callerid = Extension 101 <101>

[101-auth](auth-template)
username = 101
password = devpass101

[101-aor](aor-template)

[102](endpoint-template)
auth = 102-auth
aors = 102-aor
callerid = Extension 102 <102>

[102-auth](auth-template)
username = 102
password = devpass102

[102-aor](aor-template)
