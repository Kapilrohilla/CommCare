[general]
static = yes
writeprotect = no
clearglobalvars = no

[globals]

; Internal + outbound routing for Local/{number}@from-internal (click2call external leg).
[from-internal]
exten => _1XX,1,NoOp(Inbound internal ${EXTEN})
 same => n,Stasis(pbx,inbound,${EXTEN})
 same => n,Hangup()

exten => _X.,1,NoOp(Outbound dial ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

[default]
include => from-internal
