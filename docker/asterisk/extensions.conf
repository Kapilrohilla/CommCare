[general]
static = yes
writeprotect = no
clearglobalvars = no

[globals]

; Internal extensions: _1XX enters Stasis for inbound-route workflow (DID-style).
; All other extensions (_X.) dial directly — no ARI/Stasis events (use AMI CDR worker).
[from-internal]
exten => _1XX,1,NoOp(Inbound internal ${EXTEN} from ${CALLERID(num)})
 same => n,Stasis(pbx,inbound-route,,${EXTEN},${CALLERID(num)})
 same => n,Hangup()

exten => _X.,1,NoOp(Outbound dial ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

[default]
include => from-internal
